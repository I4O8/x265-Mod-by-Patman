# ====================================================================
# Build x265 (Patman Mod) — Multi-Arch Linux
# ====================================================================
# 构建目标：
#   x86_64 (glibc)  — Ubuntu 22.04, 静态链接 libstdc++/libgcc
#   AArch64 (glibc) — ARM64 原生构建, 静态链接 libstdc++/libgcc
#
# 产物 (每个 target):
#   x265         — multilib CLI 二进制 (8+10+12-bit 三合一)
#
# 触发方式:
#   1. push tag v*    → 构建所有 target + 自动发布 Release
#   2. workflow_dispatch → 手动选择 target 构建 + 上传 artifact
# ====================================================================

name: 🏗️ Build x265 for Linux

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build (branch/tag)'
        default: 'master'
        required: false
      targets:
        description: 'Targets to build'
        type: choice
        options:
          - all
          - x86_64-glibc
          - aarch64-glibc
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_SCRIPT: .github/scripts/build-x265.sh

# ====================================================================
# 默认 checkout 参数
# ====================================================================
# 注意: 这个 workflow 假设它运行在 Patman86/x265-Mod-by-Patman
# 的仓库或 fork 中。如果是从你自己的 fork 运行，无需修改。
# 如果要直接引用 Patman 的原仓库，取消下面 CHECKOUT_REPO 的注释。
# ====================================================================
# env:
#   CHECKOUT_REPO: Patman86/x265-Mod-by-Patman

jobs:
  # ==================================================================
  # x86_64 — glibc
  # ==================================================================
  # 使用 Ubuntu 20.04 (glibc 2.31), 兼容绝大多数现代 Linux 发行版。
  # 静态链接 libstdc++/libgcc, 减少对宿主 GCC 版本的依赖。
  # ==================================================================
  x86_64-glibc:
    name: x86_64 (glibc)
    if: ${{ github.event.inputs.targets == 'all' || github.event.inputs.targets == 'x86_64-glibc' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git_ref || '' }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            nasm

      - name: Show build environment
        run: |
          echo "=== System ==="
          uname -a
          echo "=== glibc ==="
          ldd --version 2>&1 | head -1
          echo "=== Compiler ==="
          gcc --version | head -1
          echo "=== CMake ==="
          cmake --version | head -1

      - name: Build x265 multilib
        run: |
          bash "$BUILD_SCRIPT" \
            --enable-asm ON \
            --static-libstdcxx ON \
            --enable-numa OFF \
            --jobs "$(nproc)"

      - name: Verify binary
        run: |
          echo "=== File type ==="
          file build/8bit/x265
          echo "=== Dynamic deps ==="
          ldd build/8bit/x265
          echo "=== Version ==="
          build/8bit/x265 --version 2>&1 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: x265-x86_64-unknown-linux-gnu
          path: build/8bit/x265
          if-no-files-found: error

  # ==================================================================
  # AArch64 / ARM64 — glibc
  # ==================================================================
  # 使用 GitHub 原生 ARM64 runner。
  # 如果 ubuntu-24.04-arm 在你的环境中不可用, 参考下方注释的
  # QEMU+Docker 备选方案。
  # ==================================================================
  aarch64-glibc:
    name: AArch64 (glibc)
    if: ${{ github.event.inputs.targets == 'all' || github.event.inputs.targets == 'aarch64-glibc' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git_ref || '' }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            nasm \
            libnuma-dev

      - name: Show build environment
        run: |
          echo "=== System ==="
          uname -a
          echo "=== glibc ==="
          ldd --version 2>&1 | head -1
          echo "=== Compiler ==="
          gcc --version | head -1

      - name: Build x265 multilib
        run: |
          bash "$BUILD_SCRIPT" \
            --enable-asm ON \
            --static-libstdcxx ON \
            --enable-numa OFF \
            --jobs "$(nproc)"

      - name: Verify binary
        run: |
          echo "=== File type ==="
          file build/8bit/x265
          echo "=== Dynamic deps ==="
          ldd build/8bit/x265
          echo "=== Version ==="
          build/8bit/x265 --version 2>&1 || true
          echo "=== Static lib ==="
          file build/8bit/libx265.a

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: x265-aarch64-unknown-linux-gnu
          path: build/8bit/x265
          if-no-files-found: error

  # ==================================================================
  # Release — 自动发布到 GitHub Release
  # ==================================================================
  release:
    name: 📦 Publish Release
    needs:
      - x86_64-glibc
      - aarch64-glibc
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            platform="$(basename "$dir")"
            mkdir -p "release/$platform"
            cp -v "$dir"/x265 "release/$platform/" 2>/dev/null || true
          done
          echo "=== Release files ==="
          find release/ -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/x265-x86_64-unknown-linux-gnu/x265
            release/x265-aarch64-unknown-linux-gnu/x265
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false

  # ==================================================================
  # Summary
  # ==================================================================
  summary:
    name: 📋 Build Summary
    needs:
      - x86_64-glibc
      - aarch64-glibc
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 🏗️ x265 Build Summary"
            echo ""
            echo "| Target | Status | Binary |"
            echo "|--------|--------|--------|"
            echo "| x86_64 (glibc) | ${{ needs.x86_64-glibc.result }} | x265-x86_64-unknown-linux-gnu |"
            echo "| AArch64 (glibc)| ${{ needs.aarch64-glibc.result }} | x265-aarch64-unknown-linux-gnu |"
            echo ""
            echo "> 所有二进制均为 multilib (8+10+12-bit 三合一)"
          } >> "$GITHUB_STEP_SUMMARY"
